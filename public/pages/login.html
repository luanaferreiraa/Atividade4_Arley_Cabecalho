<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DSM</title>
  <link rel="stylesheet" href="/assets/css/index.css">
  <script src="/assets/js/forms.js" defer></script>
</head>
<body>
  <main class="card form-card">
    <nav aria-label="Navegação principal">
      <a href="/">Início</a>
      <a href="/login" aria-current="page">Login</a>
      <a href="/cadastro">Cadastro</a>
    </nav>
    <h1 class="title">Entrar</h1>
    <p>Exemplo de interface. Nenhuma autenticação é realizada.</p>
    <form data-demo-form novalidate>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password">
      <button type="submit">Entrar (demonstração)</button>
      <p class="form-message" role="status"></p>
    </form>
    <p>Ainda não tem conta? <a href="/cadastro">Veja o cadastro</a>.</p>
  </main>
</body>
</html>
